# CatLabel - Server Docker Compose
# Deploy directly without git or building from source
services:
  catlabel:
    image: forgejo.syncedmedia.be/matieke/openniimstudio:latest
    pull_policy: always
    container_name: catlabel
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - catlabel_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  catlabel_data:
    name: catlabel_data
