# OpenNiimStudio - Server Docker Compose
# Deploy directly without git or building from source
services:
  openniimstudio:
    image: forgejo.syncedmedia.be/matieke/openniimstudio:latest
    pull_policy: always
    container_name: openniimstudio
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - openniimstudio_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  openniimstudio_data:
    name: catlabel_data
